<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b18"><title>Cosmos FPV •°</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b18;color:white;font:14px system-ui}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:env(safe-area-inset-top,12px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}#bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:12px;right:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}button{pointer-events:auto;border:1px solid #ffffff55;background:#111827aa;color:white;border-radius:22px;padding:11px 15px;backdrop-filter:blur(14px)}button:active{background:#58618a}#status{font-size:11px;opacity:.7}a{color:white;text-decoration:none;pointer-events:auto}#hint{position:absolute;top:50%;width:100%;text-align:center;pointer-events:none;opacity:.75;transition:opacity 1s}small{display:block;font-size:10px;opacity:.65}</style></head><body><div id="ui"><div id="top"><a href="/">‹ Sonomorphoz</a><div id="status">COSMOS FPV · contemplatif</div></div><div id="hint">Touchez le cosmos pour faire naître une métamorphose<small>Micro ou MIDI pour jouer avec la matière</small></div><div id="bottom"><button id="mic">Micro</button><button id="midi">MIDI</button><button id="palette">Palette</button><button id="pause">Pause</button></div></div><script type="module">
import * as THREE from 'https://esm.sh/three@0.175.0';
const scene=new THREE.Scene();scene.background=new THREE.Color('#080b18');scene.fog=new THREE.FogExp2(0x080b18,.013);
const camera=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,.1,350);const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance',alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
const palettes=[[0x6cc8d9,0xf2a8c2,0xffd9a1,0xbba9f5],[0x80d8b3,0xc5b4ff,0xf6c8a4,0xe6edff],[0xe0a2a8,0xffd69d,0xa9d4ed,0xd8c6f3]];let palette=0,energy=.12,velocity=0,sustain=false,paused=false,t=0,notes=0,analyser=null,bytes=null,audioCtx=null,stream=null;
const group=new THREE.Group();scene.add(group);
const shader={uniforms:{uTime:{value:0},uEnergy:{value:0},uColor:{value:new THREE.Color()}},vertexShader:`uniform float uTime;uniform float uEnergy;varying vec2 vUv;varying float vDepth;void main(){vUv=uv;vec3 p=position;float w=sin(p.y*2.7+uTime*.65+p.x*1.4)*cos(p.x*2.1-uTime*.4);p+=normal*(w*.35+uEnergy*.7*sin(p.y*5.+uTime*2.));vDepth=w;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}`,fragmentShader:`uniform float uTime;uniform vec3 uColor;varying vec2 vUv;varying float vDepth;void main(){float ink=sin(vUv.x*23.+vDepth*4.+uTime*.12)*sin(vUv.y*31.-uTime*.1);float a=(.28+.38*smoothstep(-.7,.8,ink))*(.35+.65*sin(vUv.y*3.14159));gl_FragColor=vec4(uColor*(.72+.28*ink),a);}`};
const forms=[];const geometry=new THREE.TorusKnotGeometry(2.8,.65,140,12,2,5);for(let i=0;i<26;i++){const m=new THREE.ShaderMaterial({uniforms:THREE.UniformsUtils.clone(shader.uniforms),vertexShader:shader.vertexShader,fragmentShader:shader.fragmentShader,transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending});m.uniforms.uColor.value.setHex(palettes[0][i%4]);const mesh=new THREE.Mesh(geometry,m);mesh.position.set(Math.sin(i*2.4)*13,Math.cos(i*1.7)*9,-i*13-18);const s=.7+(i%6)*.35;mesh.scale.setScalar(s);group.add(mesh);forms.push(mesh)}
const dustCount=innerWidth<700?900:1600;const dust=new Float32Array(dustCount*3);for(let i=0;i<dustCount;i++){dust[i*3]=(Math.random()-.5)*85;dust[i*3+1]=(Math.random()-.5)*65;dust[i*3+2]=-Math.random()*330}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(dust,3));const stars=new THREE.Points(geo,new THREE.PointsMaterial({color:0xd4e6ff,size:.12,transparent:true,opacity:.48,depthWrite:false}));scene.add(stars);
function pulse(n=60,v=.7){energy=Math.min(2.5,energy+v*.8);velocity=v;notes++;const f=forms[notes%forms.length];f.material.uniforms.uColor.value.setHex(palettes[palette][Math.floor(n/12)%4]);f.scale.multiplyScalar(1+v*.15)}
renderer.domElement.addEventListener('pointerdown',e=>{pulse(48+Math.round(e.clientX/innerWidth*36),.85);document.querySelector('#hint').style.opacity='0'});
document.querySelector('#palette').onclick=()=>{palette=(palette+1)%palettes.length;forms.forEach((f,i)=>f.material.uniforms.uColor.value.setHex(palettes[palette][i%4]))};
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Reprendre':'Pause'};
document.querySelector('#mic').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});audioCtx=new (window.AudioContext||window.webkitAudioContext)();const source=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=1024;bytes=new Uint8Array(analyser.frequencyBinCount);source.connect(analyser);document.querySelector('#status').textContent='COSMOS FPV · micro actif';document.querySelector('#mic').textContent='Micro ✓'}catch(e){document.querySelector('#status').textContent='Micro indisponible : '+e.message}};
document.querySelector('#midi').onclick=async()=>{try{if(!navigator.requestMIDIAccess)throw Error('Web MIDI non disponible');const access=await navigator.requestMIDIAccess();const bind=()=>{for(const input of access.inputs.values())input.onmidimessage=e=>{const [s,n,v]=e.data;const kind=s&240;if(kind===144&&v>0)pulse(n,v/127);if(kind===176&&n===64)sustain=v>=64}};bind();access.onstatechange=bind;document.querySelector('#status').textContent='COSMOS FPV · MIDI actif'}catch(e){document.querySelector('#status').textContent=e.message}};
let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min(.05,(now-last)/1000);last=now;if(paused)return;t+=dt;if(analyser){analyser.getByteFrequencyData(bytes);let sum=0;for(let i=2;i<bytes.length*.6;i++)sum+=bytes[i];const level=sum/(bytes.length*.6*255);energy=Math.max(energy,level*2.4)}energy=THREE.MathUtils.damp(energy,.09,1.6,dt);const speed=2.6+Math.min(energy,2)*2.5;camera.position.z-=dt*speed;camera.position.x=Math.sin(t*.17)*2.7+Math.sin(t*.07)*3;camera.position.y=Math.sin(t*.11)*2.2;camera.lookAt(Math.sin(t*.18+1)*3,Math.cos(t*.13)*2,camera.position.z-20);for(let i=0;i<forms.length;i++){const f=forms[i];if(f.position.z>camera.position.z+12)f.position.z-=forms.length*13;f.rotation.x+=dt*(.07+energy*.18);f.rotation.y+=dt*(.12+energy*.27);f.material.uniforms.uTime.value=t;f.material.uniforms.uEnergy.value=energy;const target=.75+(i%6)*.35+Math.min(energy,2)*.2;f.scale.setScalar(THREE.MathUtils.damp(f.scale.x,target,2,dt))}if(camera.position.z< -180){camera.position.z+=180;forms.forEach(f=>f.position.z+=180)}stars.position.z=(t*speed*.2)%20;renderer.render(scene,camera)}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))});document.addEventListener('visibilitychange',()=>{last=performance.now()});
</script></body></html>
